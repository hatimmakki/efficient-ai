[package]
name = "eai"
version = "0.2.0"
edition = "2021"
description = "Unified zero-dependency CLI for efficient-ai: structure-aware reading, lossless output compression, multi-agent hooks, session token profiling, and 1-command setup."
license = "Apache-2.0"

[[bin]]
name = "eai"
path = "src/main.rs"

[dependencies]
outline = { path = "../outline" }
squeeze = { path = "../squeeze" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
