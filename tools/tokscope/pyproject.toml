[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokscope"
version = "0.1.0"
description = "Session token attribution, history amplification modeling, and static-prefix auditing for Claude Code, Codex CLI, and Gemini CLI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7.0",
]

[project.scripts]
tokscope = "tokscope.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokscope*"]
